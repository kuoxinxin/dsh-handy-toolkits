name: publish

# Publishes to npm through npm's Trusted Publishing (OIDC): no tokens, no OTP.
# Requires a trusted publisher on npmjs.com pointing at this repository and this
# workflow file name.
# Tag pushes are handled by release.yml until the npm trusted publisher exists.
# Re-add `push: tags: ["v*"]` here once npm trust is configured.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --access public
