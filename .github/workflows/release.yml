name: release

# Builds the installable tarball and attaches it to a GitHub Release, so the
# plugin can be installed straight from the release asset
# (`dsh plugin add <tarball url>`) without going through npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test
        run: npm test

      - name: Pack
        run: |
          npm pack
          mv ./*.tgz dsh-handy-toolkits.tgz

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-handy-toolkits.tgz
          generate_release_notes: true
